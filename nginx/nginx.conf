events {}

http {
  server {
    listen 80;
    server_name _;
    client_max_body_size 0;

    location /streams/ {
      proxy_pass http://minio:9000/processed-videos/;
      proxy_http_version 1.1;
      proxy_set_header Host minio:9000;
      proxy_set_header Connection "";
      proxy_buffering on;

      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Range, Origin, Accept, Content-Type" always;
      add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;

      if ($request_method = OPTIONS) {
        return 204;
      }
    }

    location /api/ {
      proxy_pass http://backend:3001/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://backend:3001/health;
      proxy_set_header Host $host;
    }

    location / {
      return 200 "StreamForge nginx is running\n";
      add_header Content-Type text/plain;
    }
  }
}
